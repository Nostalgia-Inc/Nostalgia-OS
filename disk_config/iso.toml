# ISO Installation Configuration for Nostalgia OS
# 
# NOTE: The Runtime module is disabled to prevent "System not booted via bootc" errors.
# This is because bootc-image-builder creates container-based images, but ISO installation
# runs in a traditional environment. Disabling Runtime prevents bootc-specific operations
# during installation while still allowing proper ostree-based deployment.

[customizations.installer.kickstart]
contents = """
user --name=nostalgia --groups=wheel,dialout --password=nostalgia
rootpw --lock

%post
# Log all output for debugging
exec > >(tee -a /root/post-install.log) 2>&1
echo "Starting post-install script at $(date)"

# The image already contains the selected Plymouth theme and rebuilt initramfs.
# Seed GRUB before the installed system's first boot when the hook is available.
if [ -x /usr/libexec/nostalgia-boot-branding ]; then
  /usr/libexec/nostalgia-boot-branding || echo "GRUB branding deferred to the installed system service"
fi
# Arduino IDE 2 is installed by its background service after networking starts.

if id nostalgia >/dev/null 2>&1; then
  HOME_DIR="$(getent passwd nostalgia | cut -d: -f6)"
  if [ -n "${HOME_DIR}" ] && [ -d "${HOME_DIR}" ]; then
    cp -an /etc/skel/. "${HOME_DIR}/" 2>/dev/null || true
    install -d "${HOME_DIR}/.config"
    # The wallpaper login service configures Plasma's actual desktop IDs.
    install -d "${HOME_DIR}/.steam/root/config/uioverrides/movies"
    if [ -f /usr/share/nostalgia/media/boot-intro.webm ]; then
      ln -sf /usr/share/nostalgia/media/boot-intro.webm "${HOME_DIR}/.steam/root/config/uioverrides/movies/deck_startup.webm"
    fi
    if [ -f /usr/share/nostalgia/media/boot-outro.webm ]; then
      ln -sf /usr/share/nostalgia/media/boot-outro.webm "${HOME_DIR}/.steam/root/config/uioverrides/movies/deck_shutdown.webm"
    fi
    chown -R nostalgia:nostalgia "${HOME_DIR}/.config" 2>/dev/null || true
    chown -R nostalgia:nostalgia "${HOME_DIR}/.steam" 2>/dev/null || true
  fi
fi
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Timezone",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users"
]
disable = [
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Subscription",
  "org.fedoraproject.Anaconda.Modules.Runtime"
]
